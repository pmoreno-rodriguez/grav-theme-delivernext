en:
  DELIVERNEXT:
    ADMIN:
      THEME:
        SETTINGS: 
          TAB: Theme Settings
          THEME_CONFIG: Theme Options
          DROPDOWN_MENU: Dropdown in navbar
          PRODUCTION_MODE: Production mode
          PRODUCTION_MODE_HELP: When enabled, DELIVERNEXT will render with minified CSS
          STICKY_MENU: Sticky Menu
          BACK_TO_TOP_BUTTON: '<strong>Back to Top</strong> button'
          BACK_TO_TOP_BUTTON_HELP: Enable `Back to Top` button when scroll page.
          CUSTOM_CSS: Load custom CSS
          CUSTOM_CSS_HELP: Loads custom CSS styles from theme://assets/css/custom.css
          CUSTOM_JS: Load custom JS
          CUSTOM_JS_HELP: Loads custom JS from theme://assets/css/custom.js
          FAVICON: Choose your own favicon
          FAVICON_DESCRIPTION: Will be used instead of default favicon `theme://images/favicon.png`
          LOGO:
            TITLE: Logo Options
            ENABLED: Enabled Logo
            HEIGHT: Logo Height
            DESKTOP: Logo
            DESCRIPTION: Will be used instead of default logo `theme://images/logo.png`
            MOBILE: Mobile Logo
            TYPE_LOGO_HEADER: 'Show logo/text in header'
            TYPE_LOGO_HEADER_HELP: Choose how to display the logo in the header
            TYPE_LOGO_HEADER_IMAGE: Image
            TYPE_LOGO_HEADER_TEXT: Text
            TYPE_LOGO_HEADER_BOTH: Both
        HEADER:
          TAB: Header
          CUSTOM_MENU:
            SECTION_TITLE: 'Custom Menu Items'
            ENABLE: 'Enable Custom Menu Items'
            ENABLE_HELP: 'Determines if any defined custom menu entries are displayed in the menubar.'
            ITEMS:
              LABEL: Menu Items
              TEXT: 'Text'
              TEXT_DESCRIPTION: 'Text label for menu item.'
              ICON: 'Icon'
              ICON_DESCRIPTION: 'Font Awesome icon for menu item.'
              URL: 'URL'
              URL_DESCRIPTION: 'URL for menu item.'
              TARGET:
                LABEL: Target
                SELF: 'Open in the same frame as clicked'
                BLANK: 'Open in a new window'
        FOOTER:
          TAB: Footer
          ABOUT:
            TITLE: About Info
            DESCRIPTION: About Description
          QUICK_LINKS:
            SECTION_TITLE: Quick Links
            LABEL: Links Section Title
            ITEMS:
              LABEL: Quick Links
              TEXT: Quick Link Text
              URL: Quick Link URL
              TARGET:
                LABEL: Target
                SELF: 'Open in the same frame as clicked'
                BLANK: 'Open in a new window'
          OTHER_MENU:
            SECTION_TITLE: Other menu
            COPYRIGHT_TEXT: Copyright Text
            ITEMS:
              LABEL: Menu Items
              TEXT: Menu item text
              URL: Menu item URL
              TARGET:
                LABEL: Target
                SELF: 'Open in the same frame as clicked'
                BLANK: 'Open in a new window'
          CONTACT:
            SECTION_TITLE: Contact Information
            LABEL: Contact Section Title
            ADDRESS:
              LABEL: Lines for the address
              LINE: Line for address
            GPS: 
              LABEL: GPS Location
              SUBLABEL: '(in Google Maps format, eg: 40.65258514990599, -73.78125222264696)'

        MEDIA:
          TAB: Social Media
          SECTION_TITLE: Social Media Icons
          SECTION_TEXT: Include the full URLs of your various social media profiles. An icon or link will appear at the top of the page and in the footer for each respective platform.
          ENABLED: Enable Social Media Icons
          ICONS: 
            LABEL: Social Media Icons
            ITEMS:
              NAME: Social Media Name
              URL: URL Link to Social Media
              TARGET:
                LABEL: Target
                SELF: 'Open in the same frame as clicked'
                BLANK: 'Open in a new window'
              ICON: Icon for Social Media
      DEFAULT:
        TITLE_SECTION: Title options
        SHOW_TITLE: Show Title
        SHOW_TITLE_HELP: Show or hide the page title
        TITLE_BG_CHOICE:
          LABEL: Title Background Choice
          HELP: Select the option to display the title background format
          COLOR: Background Color
          IMAGE: Background Image
        CONTENT_SECTION: Content
        FEATURED_IMAGE_LABEL: Featured Image
        FEATURED_IMAGE_HELP: Select a file for use as the page's top featured image
        IMAGE_OPTIONS: Image options
        BIG_HEADER: Big Image in Blog
        BIG_HEADER_HELP: Display featured image in 900 x 600px
        FEATURED_IMAGE: 
          LABEL: Featured image
          HELP: Select a featured image to display at the top of the page
          WIDTH: Width
          HEIGHT: Height
        SHOW_FEATURED_IMAGE: Show Featured Image
        SHOW_FEATURED_IMAGE_HELP: Show featured image if it is defined or the first image of the media page.
        BODY_CLASSSES_CONTENT: |
            CSS classes available in the DeliverNext theme (space-separated):<br />
            > For **Default** page templates (separated by spaces): **`header-lite` `fullwidth`**<br />
            > For **Item** page templates (separated by spaces): **`header-lite` `fullwidth` `blogstyling`**<br />
            > For **Modular alt** page templates (separated by spaces): **`modular` `header-lite` `fullwidth`**<br />
            > Additionally, on modular alt type pages, you can add **`services`** or **`about`** if your page is some of these types.
      MODULAR:
        COMMON:
          ORDER_HELP: '"desc" or "asc" are valid values' 
          SHOW_ONPAGE_MENU: Show navigation on one-page sites
          SHOW_ONPAGE_MENU_HELP: On single-page sites, it adds smooth scrolling on click navigation and automatically selects the correct navigation elements as you scroll through different sections.
          BUTTONS_SECTION:
            TITLE: Buttons
            LABEL: Buttons List
            ITEMS: 
              TEXT: Button text
              URL: URL button
              STYLES:
                LABEL: Button Style
                NONE: None
                PRIMARY: Primary
                SECONDARY: Secondary
                WARNING: Warning
                INFO: Info
                OUTLINE: Outline Primary
                OUTLINE_SECONDARY: Outline Secondary
                OUTLINE_WARNING: Outline Warning
                OUTLINE_INFO: Outline Info
          SERVICES_SECTION:
            TITLE: Services
            LABEL: Services List
            ITEMS:
              ICON: Icon
              TITLE: Title
              DESC: Description
        TEAM_SECTION:
          LABEL: Members
          ITEMS:
            NAME: Member Name
            IMAGE: Profile Image
            WEBSITE: Member Website
            INFO: Member Description (in Markdown format)
            SOCIAL_MEDIA:
              LABEL: Social media
              HELP: The template allows a maximum of 6 icons for each member. 
              NAME: Social name
              NAME_HELP: You only have to write the name of the social network here (eg, Facebook, Twitter, etc)
              URL: Social URL
        FEATURES_SECTION:
          TITLE: Features
          LABEL: Features List
          ITEMS:
            ICON: Icon
            ICON_DESCRIPTION: 'Icons from <a href="https://fontawesome.com/v4/icons/" target="_blank">Fontawesome V4</a>.You have to write only the name of icon.<br /><span>Example, <strong>comment-o</strong></span>' 
            HEADER: Header
            TEXT: Description
            LINK_TEXT: Link Text
            LINK_URL: Link URL
        SHOWCASE: 
          TAB: Showcase
          SHOW_FULLSCREEN: Fullscreen Mode
          SHOW_FULLSCREEN_HELP: Display the showcase in fullscreen mode
          SLIDES: 
            LABEL: Slides
            DESCRIPTION: Showcase is a modular page that uses images uploaded in the Page Media box below
            IMAGE: Image
            IMAGE_SELECT: Select a image for showcase
            BLEND: Blend
            BACKCOLOR: Color Background
            HEADING: Heading
            SUBHEADING: Subheading
            BUTTON_TEXT: Button Text
            BUTTON_URL: Button URL
          SLIDES_SETTINGS:
            SECTION_TITLE: Slides Settings
            ARROWS: Arrows
            ARROWS_HELP: Show arrows for navigating slides
            AUTOSLIDE: Autoslide
            AUTOSLIDE_HELP: Automatically switch slides after a set interval
            AUTOSLIDE_HOVER: Auto Slide Hover Stop
            AUTOSLIDE_HOVER_HELP: Pause auto-slide when hovering over a slide
            LOOP: Loop
            LOOP_HELP: Repeat slides in a continuous loop
            TOUCH: Touch
            TOUCH_HELP: Enable touch gestures to navigate slides
            SWIPE: Swipe
            SWIPE_HELP: Enable swipe gestures to navigate slides
            INTERVAL: Interval (in milliseconds)
            INTERVAL_HELP: Set the time (in milliseconds) between slides during auto-slide
            ITEMS: Items for Slide
            ITEMS_HELP: Specify the number of items per slide
            TRANSITIONS: 
              LABEL: Select the transition effect
              HELP: Choose the transition effect between slides
              SLIDE: Slide
              FADE: Fade
              ZOOM: Zoom 
        PORTFOLIO:
          LABEL: Portfolio
          DESCRIPTION: Portfolio is a modular page that uses images uploaded in the Page Media box
          ITEMS:
            IMAGE_LABEL: Image
            IMAGE_DESCRIPTION: Select one image from list
            TITLE_LABEL: Image Title
            DESC_LABEL: Image Description
            MODALID_LABEL: Modal ID
            MODALID_DESCRIPTION: Unique identifier for the modal (e.g., 13)
            CLIENT_LABEL: Client
            CLIENT_DESCRIPTION: The client for the project
            URL_LABEL: URL
            URL_DESCRIPTION: The project's URL (optional)
            DATE_LABEL: Date
            DATE_DESCRIPTION: Date of completion
            CATEGORY_LABEL: Category
            CATEGORY_DESCRIPTION: The category of the project (e.g., Web Development)
        PRICING:
          LABEL: Pricing
          DESCRIPTION: Pricing is a modular section that displays plans with features and prices
          ITEMS:
            NAME_LABEL: Plan Name
            PRICE_LABEL: Price
            OPTIONS_LABEL: Features
            OPTIONS:
              LINE_LABEL: Feature
            BUTTON_TEXT_LABEL: Button Text
            BUTTON_URL_LABEL: Button URL
        GALLERY:
          TAB: Gallery
          TITLE: Image Gallery
          LAYOUT: 
            LABEL: Layout
            TWOCOLS: "Medium   = 2 / 1 columns"
            THREECOLS: "Standard  = 3 / 2 / 1 columns"
            FOURCOLS: "Compact = 4 / 3 / 2 columns"
          THUMB_WIDTH: Thumbnail Width
          THUMB_WIDTH_HELP: Set width for thumbnails
          THUMB_HEIGHT: Thumbnail Height
          THUMB_HEIGHT_HELP: Set height for thumbnails
          IMAGES: 
            LABEL: Images
            IMAGE: Image
            IMAGE_TITLE: Title
            IMAGE_DESCRIPTION: Description
            DESCPOSITION: 
              LABEL: Description position
              HELP: Global position for slides description, you can define a specific position on each slide (bottom, top, left, right)
              BOTTOM: Bottom
              TOP: Top
              LEFT: Left
              RIGHT: Right
            IMAGE_THUMB: Thumbnail
          VIDEO_TITLE: Video Gallery
          VIDEO_WIDTH: Video Width
          VIDEO_WIDTH_HELP: 'Default width for videos. Videos are responsive so height is not required. The width can be in px % or even vw for example, 500px, 90% or 100vw for full width videos'
          VIDEO_AUTOFOCUS: Autofocus
          VIDEO_AUTOFOCUS_HELP: If true video will be focused on play to allow keyboard sortcuts for the player, this will deactivate prev and next arrows to change slide so use it only if you know what you are doing
          VIDEO_AUTOPLAY: Autoplay
          VIDEO_AUTOPLAY_HELP: Autoplay videos on open
          VIDEOS:
            LABEL: Videos
            SOURCE: Video Source
            SOURCE_DESCRIPTION: Select the video source type
            SOURCE_OPTIONS:
              REMOTE: Remote Video
              LOCAL: Local Video
            REMOTE_VIDEO: Remote Video URL
            REMOTE_VIDEO_DESCRIPTION: URL from YouTube, Vimeo, or other external service
            REMOTE_THUMBNAIL: Remote Thumbnail
            REMOTE_THUMBNAIL_DESCRIPTION: Thumbnail URL image for gallery
            LOCAL_VIDEO: Local Video
            LOCAL_THUMBNAIL: Local Thumbnail
            LOCAL_THUMBNAIL_DESCRIPTION: Thumbnail image for gallery
            TITLE: Video Title
            DESCRIPTION: Video Description
          OPTIONS:
            TAB: Gallery Options
            EFFECTS_TITLE: Appearance & Effects
            ACTIONS_TITLE: Actions
            STYLING_TITLE: Styling
            BEHAVIOR_TITLE: Behaviors
            OVERLAY_HOVER_EFFECT:
              LABEL: Overlay effect on hover
              HELP: Set the hover effect when the mouse is over an image
              FADEIN_BOTTOM: Fade in bottom
              FADEIN_TOP: Fade in top
              FADEIN_LEFT: Fade in left
              FADEIN_RIGHT: Fade in right
              FADEIN_TOP_RIGHT: Fade in top right
              FADEIN_TOP_LEFT: Fade in top left
              FADEIN_BOTTOM_RIGHT: Fade in bottom right
              FADEIN_BOTTOM_LEFT: Fade in bottom left
            OPEN_EFFECT:
              LABEL: Open Effect
              ZOOM: Zoom
              FADE: Fade
              NONE: None
            CLOSE_EFFECT:
              LABEL: Close Effect
              ZOOM: Zoom
              FADE: Fade
              NONE: None
            SLIDE_EFFECT:
              LABEL: Slide Effect
              SLIDE: Slide
              ZOOM: Zoom
              FADE: Fade
              NONE: None
            MORE_TEXT: Read more
            MORE_TEXT_HELP: "Customize the 'Read More' text for truncated descriptions (mobile devices)"
            MORE_TEXT_DEFAULT: Read more
            MORE_LENGTH: More Length
            MORE_LENGTH_HELP: Number of characters to display on the description before adding the moreText link (only for mobiles), if 0 it will display the entire description.
            CLOSE_BUTTON: Close Button
            CLOSE_BUTTON_HELP: Show or hide the close button
            TOUCH_NAVIGATION: Touch Navigation
            TOUCH_NAVIGATION_HELP: Enable or disable the touch navigation (swipe)
            TOUCH_AXIS: Touch Follow Axis
            TOUCH_AXIS_HELP: Image follow axis when dragging on mobile.
            KEYBOARD: Keyboard Navigation
            KEYBOARD_HELP: Enable or disable the keyboard navigation
            CLOSE_OUTSIDE: Close with Outside Click
            CLOSE_OUTSIDE_HELP: Close the lightbox when clicking outside the active slide.
            MORE_STARTAT: 'Start At:'
            MORE_STARTAT_HELP: Start lightbox at defined index (0 is the first slide). If it is not defined, the clicked image is shown
            WIDTH: Width
            WIDTH_HELP: 'Default width for inline elements and iframes, you can define a specific size on each slide. You can use any unit for example 90% or 100vw for full width'
            HEIGHT: Height
            HEIGHT_HELP: 'Default height for inline elements and iframes, you can define a specific size on each slide.You can use any unit for example 90% or 100vh For inline elements you can set the height to auto'
            LOOP: Loop
            LOOP_HELP: Loop slides on end
            ZOOMABLE: Zoomable
            ZOOMABLE_HELP: Enable or disable zoomable images you can also use `data-zoomable="false"` on individual nodes.
            DRAGGABLE: Draggable
            DRAGGABLE_HELP: Enable or disable mouse drag to go prev and next slide (only images and inline content), you can also use `data-draggable="false"` on individual nodes.
            DRAGGABLE_X: Drag Tolerance X
            DRAGGABLE_X_HELP: Used with draggable. Number of pixels the user has to drag to go to prev or next slide.
            DRAGGABLE_Y: Drag Tolerance Y
            DRAGGABLE_Y_HELP: Used with draggable. Number of pixels the user has to drag up or down to close the lightbox (Set 0 to disable vertical drag).
            DRAG_AUTO_SNAP: Drag Auto-Snap
            DRAG_AUTO_SNAP_HELP: If true the slide will automatically change to prev/next or close if dragToleranceX or dragToleranceY is reached, otherwise it will wait till the mouse is released.
            PRELOAD: Preload
            PRELOAD_HELP: Enable or disable preloading.
      BLOG:
        TAB: Blog Config
        CONFIGURATION:
          LABEL: Configuration
          BLOG_ROUTE: Blog Route
          BLOG_ROUTE_HELP: The route to the main blog page that contains the "Show ..." configuration
          SHOW_BREADCRUMBS: Show Breadcrumbs
          SIDEBAR_SETTINGS: Sidebar settings
          SHOW_SIDEBAR: Show Sidebar
          SIDEBAR_CONTENT: "Sidebar Content"
          SIDEBAR_DEFAULT_TEXT: "#### Widget de Texto\nLorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna."
          SHOW_FEATURED_POSTS: Show Featured Posts
          SHOW_CATEGORIES: Show Categories
        CONTENT:
          LABEL: Content Definition
          ITEMS: 
            LABEL: Items
            LIMIT: Max Item Count
            ORDER:
              BY: Order By
              BY_DATE: Date
              BY_TITLE: Title
              BY_FOLDER: Folder
              BY_DEFAULT: Default
              DIR: Direction
              DIR_ASC: Ascending
              DIR_DESC: Descending
            PAGINATION: Pagination
            URL_TAXONOMY_FILTERS: URL Taxonomy Filters
      ITEM:
        TAB: Blog Item
        AUTHOR_OPTIONS:
          LABEL: Author options
          NAME: Author name
          AVATAR: Avatar Image
          BIOGRAPHY: Author biography
          TWITTER: Author Twitter URL
        CONFIGURATION:
          STICKY: Sticky post
          STICKY_HELP: Mark this post to show as sticky
        CONTENT:
          SUMMARY:
            LABEL: Summary Item
            SHOW: Show summary on page
            SHOW_HELP: Show summary on the page, below the subtitle. This is separate from the summary in the blog list.
            ENABLED: Enabled Summary
            FORMAT: 
              LABEL: Summary Format
              SHORT: Use the first occurence of delimter or size
              LONG: Summary delimiter will be ignored
            SIZE: Size
            DELIMITER: Summary Delimiter
      COMMON:
        TEXT_COLOR: Text Color
        TEXT_COLOR_HELP: Text color for Title
        TITLE_BG_COLOR: Background Color for Title
        MODULE_CLASSES: CSS Classes for Module
        MODULE_CLASSES_HELP: Additional CSS classes for Module
    BLOG:
      LISTING_TITLE_CATEGORY: 'Posts in Category: '
      LISTING_TITLE_TAG: 'Posts with Tag: '
      LISTING_TITLE_AUTHOR: 'Posts written by Author: '
      LISTING_TITLE_MONTH: 'Post of the month: '
      PAGINATION: 
        PREV: Previous Post
        NEXT: Next Post
      CONTINUE_READING: Continue Reading...
    ARCHIVES:
      BY_TAG: By Tag
      BY_MONTH: By Month
    SIDEBAR:
      LANGSWITCHER: Choose language
      SEARCH: Search
      FEATURED_POSTS: Featured Posts
      FEATURED_MORE: More featured posts
      NO_FEATURED: No featured posts
      LOGIN_SECTION: Login
      LOGGUED_AS: 'Logged as: '
      RELATEDPAGES_SECTION: Related pages
      ARCHIVES_SECTION: Archives
      RANDOM_ARTICLE:
        LABEL: Random Article
        BUTTON: I'm Feeling Lucky!
      SYNDICATE:
        LABEL: Syndicate 
      TAXONOMYLIST:
        LABEL: Popular Tags
    SHOWCASE:
      ARROW_PREV: Previous
      ARROW_NEXT: Next
    MISC:
      BACK_TO_TOP: Back to top
      GPS_LOCATION: GPS Address
      IN: in
fr:
  DELIVERNEXT:
    ADMIN:
      THEME:
        SETTINGS:
          TAB: Paramètres du thème
          THEME_CONFIG: Options du thème
          DROPDOWN_MENU: Menu déroulant dans la barre de navigation
          PRODUCTION_MODE: Mode production
          PRODUCTION_MODE_HELP: Lorsqu’il est activé, DELIVERNEXT s’affichera avec une feuille CSS minifiée
          STICKY_MENU: Menu fixe
          BACK_TO_TOP_BUTTON: '<strong>Remonter</strong>'
          BACK_TO_TOP_BUTTON_HELP: Activer le bouton « Remonter » lors du défilement de la page
          CUSTOM_CSS: Charger un CSS personnalisé
          CUSTOM_CSS_HELP: 'Charge les styles CSS personnalisés depuis theme://assets/css/custom.css'
          CUSTOM_JS: Charger un JS personnalisé
          CUSTOM_JS_HELP: 'Charge un JS personnalisé depuis theme://assets/css/custom.js'
          FAVICON: Choisissez votre propre favicon
          FAVICON_DESCRIPTION: 'Sera utilisé à la place du favicon par défaut `theme://images/favicon.png`'
          LOGO:
            TITLE: Options du logo
            ENABLED: Activer le logo
            HEIGHT: Hauteur du logo
            DESKTOP: Logo
            DESCRIPTION: 'Sera utilisé à la place du logo par défaut `theme://images/logo.png`'
            MOBILE: Logo mobile
            TYPE_LOGO_HEADER: 'Afficher le logo/texte dans l’en-tête'
            TYPE_LOGO_HEADER_HELP: Choisissez comment afficher le logo dans l’en-tête
            TYPE_LOGO_HEADER_IMAGE: Image
            TYPE_LOGO_HEADER_TEXT: Texte
            TYPE_LOGO_HEADER_BOTH: Les deux
        HEADER:
          TAB: En-tête
          CUSTOM_MENU:
            SECTION_TITLE: 'Éléments personnalisés du menu'
            ENABLE: 'Activer les éléments personnalisés du menu'
            ENABLE_HELP: 'Détermine si les entrées personnalisées du menu définies sont affichées dans la barre de menu.'
            ITEMS:
              LABEL: Éléments du menu
              TEXT: 'Texte'
              TEXT_DESCRIPTION: 'Libellé du menu'
              ICON: 'Icône'
              ICON_DESCRIPTION: 'Icône Font Awesome pour l’élément du menu.'
              URL: 'URL'
              URL_DESCRIPTION: 'URL de l’élément du menu.'
              TARGET:
                LABEL: Cible
                SELF: 'Ouvrir dans le même cadre'
                BLANK: 'Ouvrir dans une nouvelle fenêtre'
        FOOTER:
          TAB: Pied de page
          ABOUT:
            TITLE: À propos
            DESCRIPTION: Description « À propos »
          QUICK_LINKS:
            SECTION_TITLE: Liens rapides
            LABEL: Titre de la section des liens
            ITEMS:
              LABEL: Liens rapides
              TEXT: Texte du lien rapide
              URL: URL du lien rapide
              TARGET:
                LABEL: Cible
                SELF: 'Ouvrir dans le même cadre'
                BLANK: 'Ouvrir dans une nouvelle fenêtre'
          OTHER_MENU:
            SECTION_TITLE: Autre menu
            COPYRIGHT_TEXT: Texte du copyright
            ITEMS:
              LABEL: Éléments du menu
              TEXT: Texte de l’élément du menu
              URL: URL de l’élément du menu
              TARGET:
                LABEL: Cible
                SELF: 'Ouvrir dans le même cadre'
                BLANK: 'Ouvrir dans une nouvelle fenêtre'
          CONTACT:
            SECTION_TITLE: Informations de contact
            LABEL: Titre de la section Contact
            ADDRESS:
              LABEL: Lignes de l’adresse
              LINE: Ligne de l’adresse
            GPS:
              LABEL: Position GPS
              SUBLABEL: '(au format Google Maps, par ex : 40.65258514990599, -73.78125222264696)'

        MEDIA:
          TAB: Réseaux sociaux
          SECTION_TITLE: Icônes des réseaux sociaux
          SECTION_TEXT: Indiquez les URLs complètes de vos différents profils sur les réseaux sociaux. Une icône ou un lien apparaîtra en haut de la page et dans le pied de page pour chaque plateforme respective.
          ENABLED: Activer les icônes des réseaux sociaux
          ICONS:
            LABEL: Icônes des réseaux sociaux
            ITEMS:
              NAME: Nom du réseau social
              URL: Lien URL du réseau social
              TARGET:
                LABEL: Cible
                SELF: 'Ouvrir dans le même cadre'
                BLANK: 'Ouvrir dans une nouvelle fenêtre'
              ICON: Icône pour le réseau social
      DEFAULT:
        TITLE_SECTION: Options du titre
        SHOW_TITLE: Afficher le titre
        SHOW_TITLE_HELP: Afficher ou masquer le titre de la page
        TITLE_BG_CHOICE:
          LABEL: Choix du fond pour le titre
          HELP: Sélectionnez l’option pour afficher le format d’arrière-plan du titre
          COLOR: Couleur d’arrière-plan
          IMAGE: Image d’arrière-plan
        CONTENT_SECTION: Contenu
        FEATURED_IMAGE_LABEL: Image à la une
        FEATURED_IMAGE_HELP: Sélectionnez un fichier à utiliser comme image principale en haut de la page
        IMAGE_OPTIONS: Options de l’image
        BIG_HEADER: Grande image dans le blog
        BIG_HEADER_HELP: Afficher l’image à la une en 900 x 600px
        FEATURED_IMAGE:
          LABEL: Image à la une
          HELP: Sélectionnez une image mise en avant à afficher en haut de la page
          WIDTH: Largeur
          HEIGHT: Hauteur
        SHOW_FEATURED_IMAGE: Afficher l’image à la une
        SHOW_FEATURED_IMAGE_HELP: Affiche l’image à la une si elle est définie ou la première image de la page média.
        BODY_CLASSSES_CONTENT: '|
            Classes CSS disponibles pour le thème DeliverNext (séparées par des espaces):<br />
            > Pour les modèles de pages **Défaut** (séparés par des espaces) : **`header-lite` `fullwidth`**<br />
            > Pour les modèles de pages **Item** (séparés par des espaces) : **`header-lite` `fullwidth` `blogstyling`**<br />
            > Pour les modèles de pages **Modular alt** (séparés par des espaces) : **`modular` `header-lite` `fullwidth`**<br />
            > De plus, sur les pages de type modular alt, vous pouvez ajouter **`services`** ou **`about`** si votre page est de ces types.'
      MODULAR:
        COMMON:
          ORDER_HELP: '"desc" ou "asc" sont des valeurs valides'
          SHOW_ONPAGE_MENU: Afficher la navigation sur les sites « one-page »
          SHOW_ONPAGE_MENU_HELP: Sur les sites monopage, ajoute un défilement fluide au clic sur la navigation et sélectionne automatiquement les bons éléments dès que vous faites défiler la page.
          BUTTONS_SECTION:
            TITLE: Boutons
            LABEL: Liste des boutons
            ITEMS:
              TEXT: Texte du bouton
              URL: URL du bouton
              STYLES:
                LABEL: Style du bouton
                NONE: Aucun
                PRIMARY: Principal
                SECONDARY: Secondaire
                WARNING: Avertissement
                INFO: Info
                OUTLINE: Contour principal
                OUTLINE_SECONDARY: Contour secondaire
                OUTLINE_WARNING: Contour avertissement
                OUTLINE_INFO: Contour info
          SERVICES_SECTION:
            TITLE: Services
            LABEL: Liste des services
            ITEMS:
              ICON: Icône
              TITLE: Titre
              DESC: Description
        TEAM_SECTION:
          LABEL: Membres
          ITEMS:
            NAME: Nom du membre
            IMAGE: Image de profil
            WEBSITE: Site du membre
            INFO: Description du membre (en format Markdown)
            SOCIAL_MEDIA:
              LABEL: Réseaux sociaux
