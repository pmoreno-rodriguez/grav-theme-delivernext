extends@: default

form:
  fields:
    tabs:

      fields:
        blog:
          type: tab
          title: DELIVERNEXT.ADMIN.ITEM.TAB

          fields:

            _authorConfig:
              type: spacer
              title: DELIVERNEXT.ADMIN.ITEM.AUTHOR_OPTIONS.LABEL
            header.author:
              type: text
              toggleable: true
              size: medium
              label: DELIVERNEXT.ADMIN.ITEM.AUTHOR_OPTIONS.NAME

            _summaryConfig:
              type: spacer
              title: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.LABEL
            header.show_summary:
              type: toggle
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.SHOW
              help: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.SHOW_HELP
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.summary.enabled:
              type: toggle
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.ENABLED
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.summary.format:
              type: select
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.FORMAT.LABEL
              classes: fancy
              options:
                'short': DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.FORMAT.SHORT
                'long': DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.FORMAT.LONG
            header.summary.size:
              type: text
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.SIZE
              classes: large
              placeholder: 300
              validate:
                type: int
                min: 1
            header.summary.delimiter:
              type: text
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.CONTENT.SUMMARY.DELIMITER
              classes: large
              placeholder: ===

            _externalLinkConfig:
              type: spacer
              title: DELIVERNEXT.ADMIN.ITEM.EXTERNAL_LINK.LABEL
            header.item_external_url:
              type: text
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.EXTERNAL_LINK.URL
              help: DELIVERNEXT.ADMIN.ITEM.EXTERNAL_LINK.URL_HELP
              placeholder: 'https://example.com/article'
            header.item_external_text:
              type: text
              toggleable: true
              label: DELIVERNEXT.ADMIN.ITEM.EXTERNAL_LINK.TEXT
              help: DELIVERNEXT.ADMIN.ITEM.EXTERNAL_LINK.TEXT_HELP
              placeholder: External Link
          import@:
            type: partials/item-bits
